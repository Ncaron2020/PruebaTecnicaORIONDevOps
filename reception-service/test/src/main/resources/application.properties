spring.application.name=test

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:resception_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# reception-service no declara la cola "events_queue" (la declara orders-service
# al arrancar). Sin esto, si reception-service arranca antes/aislado de
# orders-service (como en CI, o por orden de arranque en Kubernetes), el
# listener falla duro al no encontrar la cola. Con missing-queues-fatal=false,
# el contexto de Spring arranca igual y el listener reintenta conectarse en
# segundo plano hasta que la cola exista. Configuracion de resiliencia de
# plataforma, no cambia comportamiento de negocio.
spring.rabbitmq.listener.simple.missing-queues-fatal=false

connection.rabbit.consumer=events_queue
