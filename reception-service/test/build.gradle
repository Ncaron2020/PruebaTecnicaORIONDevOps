plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'reception'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// CVE-2026-41293, CVE-2026-43512, CVE-2026-43515, CVE-2026-65182,
// CVE-2026-65905, CVE-2026-68525 (CRITICAL) en tomcat-embed-core 10.1.46,
// detectadas por Trivy en el pipeline. El proyecto usa el plugin
// io.spring.dependency-management, que gestiona las versiones via su propio
// BOM - el bloque nativo de Gradle "constraints {}" NO tiene precedencia
// sobre ese BOM (primer intento de fix que no funcio, confirmado por Trivy
// en el pipeline). La forma correcta de overridear una version gestionada
// por este plugin es su propia DSL "dependencyManagement":
dependencyManagement {
	dependencies {
		dependency 'org.apache.tomcat.embed:tomcat-embed-core:10.1.55'
		dependency 'org.apache.tomcat.embed:tomcat-embed-el:10.1.55'
		dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.55'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
