image:
  repository: ghcr.io/ncaron2020/reception-service
  tag: latest

# >= 2 para disponibilidad (un pod en problemas no deja el servicio caido).
# Se sobreescribe a 1 en values-dev.yaml para entornos locales con recursos
# limitados (ej. un solo nodo de kind en una laptop).
replicaCount: 2

service:
  port: 8080

# Valores no sensibles (van al ConfigMap)
env:
  dbHost: postgres
  dbPort: "5432"
  dbName: resception_test
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"

# ADVERTENCIA: mismo caso que orders-service/values.yaml e infra/values.yaml
# - valores de ejemplo versionados a proposito para esta prueba, deberian
# inyectarse aparte en un despliegue real. Duplicado respecto a
# charts/infra/values.yaml (postgres.auth.*, rabbitmq.auth.*) por ser
# charts separados sin values.yaml compartido.
postgres:
  user: postgres
  password: postgres

rabbitmq:
  user: guest
  password: guest

# Limite de memoria directamente ligado al incidente analizado en RCA.md:
# el escenario documentado ahi usaba un limite de 128Mi para este mismo
# worker, insuficiente para una JVM de Spring Boot (causaba OOMKilled en
# bucle). Este valor parte de esa leccion, no de una cifra arbitraria -
# se valida con el despliegue real a continuacion.
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
