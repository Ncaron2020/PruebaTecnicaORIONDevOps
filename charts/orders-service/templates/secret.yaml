apiVersion: v1
kind: Secret
metadata:
  name: orders-service-secret
type: Opaque
# "stringData" acepta texto plano y Kubernetes lo convierte a base64
# automaticamente al crear el objeto - no hace falta codificarlo a mano
# en el template (existe tambien "data", que si exige el valor ya en
# base64, pero stringData es mas simple de leer aqui).
stringData:
  RABBITMQ_URL: {{ printf "amqp://%s:%s@%s:%s/" .Values.rabbitmq.user .Values.rabbitmq.password .Values.rabbitmq.host .Values.rabbitmq.port | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
