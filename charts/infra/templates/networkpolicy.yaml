# Cada NetworkPolicy es "default deny" para el trafico de entrada de ese
# pod: en cuanto un pod tiene AL MENOS una NetworkPolicy que lo selecciona,
# Kubernetes bloquea todo el ingress que no este explicitamente permitido.
# No hace falta una politica "deny-all" aparte - basta con declarar aqui
# solo lo que SI se permite.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: reception-service
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orders-service
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-network-policy
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orders-service
        - podSelector:
            matchLabels:
              app: reception-service
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
    # Puerto de metricas Prometheus (plugin rabbitmq_prometheus, activo por
    # defecto - ver HU-008). Sin esta regla, cualquier Prometheus real que
    # se despliegue despues quedaria bloqueado por esta misma politica,
    # confirmado en la practica durante la validacion de HU-008: el scrape
    # fallaba con "context deadline exceeded" hasta agregar esto. Cualquier
    # pod etiquetado "monitoring: true" (convencion, no depende de un stack
    # especifico) puede leer metricas, nada mas.
    - from:
        - podSelector:
            matchLabels:
              monitoring: "true"
      ports:
        - protocol: TCP
          port: 15692
